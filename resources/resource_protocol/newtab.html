<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servo - New Tab</title>
    <link rel="stylesheet" href="resource:///newtab.css" />
  </head>
  <body>
    <a id="home-logo" href="https://servo.org">
      <img class="light" src="resource:///servo-color-positive-no-container.svg" draggable="false"/>
      <img class="dark" src="resource:///servo-color-negative-no-container.svg" draggable="false"/>
    </a>
    <form id="home-search" action="https://duckduckgo.com/html/">
      <input name="q" placeholder="Search the web…" autofocus />
      <button type="submit">Go!</button>
    </form>
    <script>
      fetch("servo:home")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("home-logo").hidden = data.showLogo === false;
          document.getElementById("home-search").hidden = data.showSearch === false;
        })
        .catch(() => {});
    </script>
    <a href="https://servo.org">Home</a>
  </body>
</html>
