name: WPT Import

on:
  schedule:
    # Run this job every Sunday at 00:00.
    - cron: "0 0 * * 0"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents/pull-requests: open the sync PR.
# actions: upload/download WPT logs from the Linux jobs.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  linux:
    # This job is only useful when run on upstream aether.
    if: github.repository == 'AetherBrowser/aether' || github.event_name == 'workflow_dispatch'
    name: Linux
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      wpt-sync-from-upstream: true
      wpt: true
      unit-tests: false

  sync:
    # This job is only useful when run on upstream aether.
    if: github.repository == 'AetherBrowser/aether' || github.event_name == 'workflow_dispatch'
    name: Synchronize WPT Nightly
    runs-on: ubuntu-22.04
    needs:
      - "linux"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wpt-full-logs-linux
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        uses: ./.github/actions/apt-mirrors
      - name: Prep environment
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
      - name: Configure git and unshallow
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Aether WPT Sync"
          git fetch --unshallow origin
      - name: Fetch upstream changes before syncing
        run: |
          ./mach update-wpt --sync --patch
      - name: Amend commit with test results
        run: |
          export CURRENT_DATE=$(date +"%d-%m-%Y")
          echo $CURRENT_DATE
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV
          ./mach update-wpt --full linux/raw/*.log
          git add tests/wpt/meta
          uv lock
          git commit -a --amend -s --no-edit
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.WPT_SYNC_TOKEN || github.token }}
          branch: wpt_update_${{ env.CURRENT_DATE }}
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.WPT_SYNC_TOKEN || github.token }}
          UPDATE_BRANCH: wpt_update_${{ env.CURRENT_DATE }}
        run: |
          BODY=$(cat <<EOF
          Automated downstream sync of changes from upstream as of ${{ env.CURRENT_DATE }}
          [no-wpt-sync]
          EOF
          )
          gh pr create \
            --title "Sync WPT with upstream (${{ env.CURRENT_DATE }})" \
            --body "$BODY" --head ${{ env.UPDATE_BRANCH }}
