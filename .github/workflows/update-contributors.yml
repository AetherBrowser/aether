name: Update contributor table

on:
  schedule:
    # 00:00 UTC on the 1st and the 15th of every month.
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh CONTRIBUTING contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the contributor section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_contributors.py

      - name: Commit CONTRIBUTING.md when the table changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTING.md
          if git diff --cached --quiet; then
            echo "No contributor changes."
            exit 0
          fi
          git commit -m "Update fork contributor table"
          git push
